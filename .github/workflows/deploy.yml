name: Daily builds of changes to the TSConfig bases dir

# For testing
# on: push

# For production
on:
  schedule:
    - cron: 0 4 * * *
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set-up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set-up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v1.x

      # Build all the packages
      - name: Create packages for TSConfig JSONs
        run: deno run --allow-read --allow-write --allow-net scripts/create-npm-packages.ts

      # Deploy anything which differs from the npm version of a tsconfig
      - name: "Deploy built packages to NPM"
        run: deno run --allow-read --allow-run --allow-net scripts/deploy-changed-npm-packages.ts
